<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070614">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>DOAL</title>
<style>
:root{--c:#2ef2ff;--m:#ff3df0;--v:#8b5cff;--y:#ffc857;--t:#eef0ff;--dim:#9a9cc4;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{min-height:100vh;min-height:100dvh;background:#070614;color:var(--t);font:16px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif;padding:max(20px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));overflow-x:hidden}
body::before,body::after{content:"";position:fixed;width:340px;height:340px;border-radius:50%;filter:blur(90px);opacity:.45;z-index:-1}
body::before{background:var(--v);top:-90px;left:-110px}
body::after{background:var(--m);bottom:-120px;right:-120px;opacity:.3}
main{max-width:480px;margin:0 auto;display:grid;gap:14px}
#app{display:grid;gap:14px}
.glass{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.13);border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 32px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1)}
.card{padding:18px}
h1{font-size:2rem;font-weight:800;letter-spacing:.18em;color:var(--c);text-shadow:0 0 14px var(--c),0 0 34px rgba(46,242,255,.5)}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:6px 4px 0}
.hr{text-align:right;min-width:0}
#date{color:var(--dim);font-size:.85rem}
#who{color:var(--dim);font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:190px}
#sync{color:var(--c);font-size:.72rem;min-height:1em}
button{font:inherit;cursor:pointer;border:0;color:var(--t);background:none}
button:focus-visible,input:focus-visible,.main:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.field{width:100%;min-width:0;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);border-radius:14px;color:var(--t);font:inherit;padding:12px 14px;outline:none}
.field:focus{border-color:var(--c);box-shadow:0 0 0 3px rgba(46,242,255,.2),0 0 16px rgba(46,242,255,.35)}
::placeholder{color:#6f7199}
.btn{padding:12px 20px;border-radius:14px;font-weight:700;color:#06050f;background:linear-gradient(135deg,var(--c),var(--v));box-shadow:0 0 16px rgba(46,242,255,.5)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5}
.ghost{padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--dim);font-size:.85rem}
.ghost:active{background:rgba(255,255,255,.14)}
.ghost:disabled{opacity:.5}
.auth{display:grid;gap:12px;padding:22px}
.auth p{color:var(--dim);font-size:.85rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .ghost{padding:12px 14px;font-size:1rem}
#err{color:var(--m);min-height:1.2em;font-size:.9rem}
.hero{padding:18px 20px;display:flex;align-items:center;gap:16px}
#streak{font-size:3.6rem;font-weight:800;line-height:1;color:#fff;text-shadow:0 0 12px var(--m),0 0 34px var(--m);min-width:1.1ch;text-align:center}
.hero b{font-size:1.05rem;display:block}
.hero small{color:var(--dim);font-size:.8rem}
.stats{margin-left:auto;display:grid;gap:6px;text-align:right}
.stats div{font-size:.8rem;color:var(--dim)}
.stats b{display:inline;color:var(--c);font-size:.95rem}
.row{display:flex;justify-content:space-between;color:var(--dim);font-size:.85rem;margin-bottom:10px}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
#fill,#tfill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--c),var(--v),var(--m));box-shadow:0 0 14px var(--c),0 0 26px var(--m);transition:width .5s cubic-bezier(.2,.8,.2,1)}
#msg{margin-top:14px;font-weight:600}
.add{display:grid;gap:10px;padding:12px}
.addrow{display:flex;gap:10px}
.opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.opts .field{width:auto;flex:1;min-width:130px;padding:9px 12px;font-size:.9rem}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:var(--dim);font-size:.85rem}
.seg button.on{color:#06050f;font-weight:700;background:var(--c);box-shadow:0 0 12px var(--c)}
.seg .p0.on{background:var(--c);box-shadow:0 0 12px var(--c)}
.seg .p1.on{background:var(--y);box-shadow:0 0 12px var(--y)}
.seg .p2.on{background:var(--m);box-shadow:0 0 12px var(--m)}
.tog.on{color:#06050f;background:var(--v);font-weight:700;box-shadow:0 0 12px var(--v)}
.opts .seg{flex:none}
.tools{display:grid;gap:10px}
ul{list-style:none;display:grid;gap:10px;padding:0}
li{padding:0;border-radius:18px;border-left:3px solid var(--y)}
li.p0{border-left-color:var(--c)}li.p2{border-left-color:var(--m)}
.top{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px}
.main{flex:1;min-width:0;cursor:pointer;border-radius:8px}
.tx{display:block;overflow-wrap:anywhere;transition:color .25s}
li.done .tx{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--m)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chips:empty{display:none}
.chip{font-size:.72rem;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--dim)}
.chip.late{background:rgba(255,61,240,.2);color:#ff9af6}
.chip.now{background:rgba(255,200,87,.2);color:var(--y)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border-radius:9px;border:2px solid var(--c);background:transparent;display:grid;place-items:center;cursor:pointer;transition:.2s}
input[type=checkbox]:checked{background:linear-gradient(135deg,var(--c),var(--m));border-color:transparent;box-shadow:0 0 14px var(--c)}
input[type=checkbox]:checked::after{content:"";width:6px;height:12px;border:solid #06050f;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.del{flex:none;width:36px;height:36px;border-radius:12px;background:rgba(255,61,240,.12);color:var(--m);font-size:1.3rem;line-height:1}
.del:active{background:rgba(255,61,240,.3)}
.del.sm{width:30px;height:30px;font-size:1.1rem}
.panel{display:grid;gap:10px;padding:4px 14px 14px;border-top:1px solid rgba(255,255,255,.08)}
.panel .opts{margin-top:8px}
.subs{display:grid;gap:8px}
.sub{display:flex;align-items:center;gap:8px}
.sub label{flex:1;display:flex;align-items:center;gap:10px;min-width:0;font-size:.92rem}
.sub input[type=checkbox]{width:22px;height:22px;border-radius:7px}
.sub input[type=checkbox]:checked::after{width:5px;height:10px}
.sub.done span{color:var(--dim);text-decoration:line-through}
.empty{text-align:center;color:var(--dim);padding:26px 16px;border-left-width:1px}
.focus{display:grid;gap:12px;padding:18px;text-align:center}
#tm{font-size:3rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.04em;text-shadow:0 0 14px var(--c)}
#ftask{color:var(--dim);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:11px 18px;border-radius:14px;background:rgba(20,18,50,.92);border:1px solid var(--c);box-shadow:0 0 18px rgba(46,242,255,.35);font-size:.9rem;transition:.3s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header><h1>DOAL</h1><div class="hr"><div id="date"></div><div id="who"></div><div id="sync"></div></div></header>

  <!-- SIGN IN -->
  <section id="auth" class="glass auth">
    <b>Sign in to your account</b>
    <input class="field" id="em" type="email" inputmode="email" autocomplete="username" autocapitalize="none" placeholder="you@gmail.com" aria-label="Gmail">
    <input class="field" id="pw" type="password" autocomplete="current-password" placeholder="Password (6+ characters)" aria-label="Password">
    <div id="err" role="alert"></div>
    <div class="two"><button class="btn" id="signin" type="button">Sign in</button><button class="ghost" id="signup" type="button">Create account</button></div>
    <button class="ghost" id="forgot" type="button">Forgot password?</button>
    <p>Your tasks and streak are saved to your account, so the same email and password works on any device.</p>
  </section>

  <!-- APP -->
  <div id="app" hidden>
    <section class="glass hero">
      <div id="streak">0</div>
      <div><b>day streak</b><small>Finish one task a day</small></div>
      <div class="stats"><div>Best <b id="best">0</b></div><div>Focus <b id="fmin">0</b> min</div></div>
    </section>

    <section class="glass card">
      <div class="row"><span>Today's progress</span><span id="cnt">0 / 0</span></div>
      <div class="bar"><div id="fill"></div></div>
      <p id="msg"></p>
    </section>

    <section class="glass add">
      <div class="addrow">
        <input class="field" id="in" type="text" placeholder="Add a task" maxlength="120" autocomplete="off" aria-label="New task">
        <button class="btn" id="addbtn" type="button">Add</button>
      </div>
      <div class="opts">
        <div class="seg" id="apri"><button type="button" class="p0" data-p="0">Low</button><button type="button" class="p1 on" data-p="1">Med</button><button type="button" class="p2" data-p="2">High</button></div>
        <input class="field" id="due" type="date" aria-label="Due date">
        <button class="ghost tog" id="dly" type="button">Daily</button>
      </div>
    </section>

    <section class="tools">
      <div class="seg" id="filt"><button type="button" data-f="open" class="on">Open</button><button type="button" data-f="today">Today</button><button type="button" data-f="done">Done</button><button type="button" data-f="all">All</button></div>
      <input class="field" id="q" type="text" placeholder="Search tasks" autocomplete="off" aria-label="Search tasks">
    </section>

    <ul id="list"></ul>

    <section class="glass focus" id="focus">
      <div id="ftask">No task selected</div>
      <div id="tm">25:00</div>
      <div class="bar"><div id="tfill"></div></div>
      <div class="seg" id="durs"><button type="button" data-d="15">15</button><button type="button" data-d="25" class="on">25</button><button type="button" data-d="50">50</button></div>
      <div class="foot"><button class="btn" id="go" type="button">Start</button><button class="ghost" id="rst" type="button">Reset</button></div>
    </section>

    <div class="foot">
      <button class="ghost" id="clr" type="button">Clear finished</button>
      <button class="ghost" id="exp" type="button">Export</button>
      <button class="ghost" id="imp" type="button">Import</button>
      <button class="ghost" id="out" type="button">Log out</button>
    </div>
    <input type="file" id="file" accept="application/json,.json" hidden>
  </div>
</main>
<div id="toast" role="status"></div>

<script>
const $=id=>document.getElementById(id);
const el=(t,p={},...k)=>{const e=document.createElement(t);for(const a in p){const v=p[a];if(a==="class")e.className=v;else if(a==="text")e.textContent=v;else if(a in e)e[a]=v;else e.setAttribute(a,v)}e.append(...k);return e};
const pad=n=>String(n).padStart(2,"0");
const dk=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>dk(new Date());
const DRE=/^\d{4}-\d\d-\d\d$/;

/* ---------- Firebase config ---------- */
const CFG={
  apiKey:"AIzaSyBX3odijQ2IkTgB1iI-cJvfzDh7UD9btZQ",
  authDomain:"doal-goal-tracker.firebaseapp.com",
  projectId:"doal-goal-tracker",
  storageBucket:"doal-goal-tracker.firebasestorage.app",
  messagingSenderId:"599968154532",
  appId:"1:599968154532:web:1a148689e7d249b6f23731"
};
const FB="https://www.gstatic.com/firebasejs/12.19.0/";
const load=u=>import(FB+u);

/* ---------- local cache (so the app opens instantly and works offline) ---------- */
const mem={};
const db={
  get(k){try{const v=localStorage.getItem(k);if(v!=null)return JSON.parse(v)}catch(e){}return k in mem?JSON.parse(mem[k]):null},
  set(k,v){const s=JSON.stringify(v);try{localStorage.setItem(k,s)}catch(e){mem[k]=s}},
  del(k){try{localStorage.removeItem(k)}catch(e){}delete mem[k]}
};

/* ---------- state ---------- */
let user=null,S=null,cloud=null,cloudState="loading",unsub=null,saveT=null;
const ui={f:"open",q:"",open:null,pri:1,due:"",daily:false,refocus:null};
const norm=t=>({
  id:t.id||Date.now()+Math.random(),
  text:String(t.text||"").slice(0,120),
  pri:[0,1,2].includes(t.pri)?t.pri:1,
  due:DRE.test(t.due)?t.due:"",
  daily:!!t.daily,
  doneOn:DRE.test(t.doneOn)?t.doneOn:"",
  subs:Array.isArray(t.subs)?t.subs.map(s=>({t:String(s.t||"").slice(0,100),d:!!s.d})):[],
  f:+t.f||0
});
const clean=d=>({tasks:(d&&d.tasks||[]).map(norm),days:d&&Array.isArray(d.days)?d.days.filter(x=>DRE.test(x)):[],fmin:+(d&&d.fmin)||0});
const isDone=t=>t.daily?t.doneOn===today():!!t.doneOn;
function sync(){
  const t=today(),any=S.tasks.some(x=>x.doneOn===t),has=S.days.includes(t);
  if(any&&!has)S.days.push(t);
  if(!any&&has)S.days=S.days.filter(d=>d!==t);
}
function streaks(){
  const set=new Set(S.days);let d=new Date();
  if(!set.has(dk(d)))d.setDate(d.getDate()-1);
  let cur=0;while(set.has(dk(d))){cur++;d.setDate(d.getDate()-1)}
  let best=0,run=0,prev=null;
  for(const s of [...set].sort()){
    const [y,m,dd]=s.split("-").map(Number),dt=new Date(y,m-1,dd);
    run=prev&&Math.round((dt-prev)/864e5)===1?run+1:1;best=Math.max(best,run);prev=dt;
  }
  return[cur,best];
}
function dueInfo(t){
  if(!t.due)return null;
  const td=today();
  if(t.due<td)return["Overdue","late"];
  if(t.due===td)return["Due today","now"];
  const tm=new Date();tm.setDate(tm.getDate()+1);
  if(t.due===dk(tm))return["Tomorrow",""];
  const [y,m,d]=t.due.split("-").map(Number);
  return[new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"}),""];
}
function cmp(a,b){
  if(isDone(a)!==isDone(b))return isDone(a)?1:-1;
  const x=a.due||"9999",y=b.due||"9999";
  if(x!==y)return x<y?-1:1;
  return b.pri-a.pri||a.id-b.id;
}
function message(p,total,n){
  if(!total)return "Add your first task. Small steps count.";
  if(p===100)return n>1?"All clear. "+n+" days strong.":"Clean sweep. Come back tomorrow to build the streak.";
  if(p>=50)return "Past halfway. Finish what you started.";
  if(p>0)return "Momentum is on. One more.";
  return n>0?"Protect your "+n+"-day streak. Finish one task.":"Finish one task today to start your streak.";
}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.i);toast.i=setTimeout(()=>t.classList.remove("show"),2400)}
const setSync=t=>{$("sync").textContent=t};
const err=m=>{$("err").textContent=m||""};

/* ---------- cloud sync ---------- */
const cache=()=>{if(user&&S)db.set("doal.cache",{uid:user.uid,email:user.email,data:S})};
function push(){
  saveT=null;
  if(!cloud||!user||!S)return Promise.resolve();
  const{doc,setDoc}=cloud.f;
  return setDoc(doc(cloud.fs,"users",user.uid),{tasks:S.tasks,days:S.days,fmin:S.fmin||0,updatedAt:Date.now()})
    .then(()=>setSync("Synced")).catch(()=>setSync("Offline"));
}
function save(){
  cache();
  if(!cloud||!user)return;
  setSync("Saving\u2026");clearTimeout(saveT);saveT=setTimeout(push,500);
}
function detach(){if(unsub){unsub();unsub=null}}
function attach(){
  detach();
  const{doc,onSnapshot}=cloud.f;
  unsub=onSnapshot(doc(cloud.fs,"users",user.uid),snap=>{
    if(saveT||snap.metadata.hasPendingWrites)return;
    if(!snap.exists()){if(!snap.metadata.fromCache)push();return}
    const n=clean(snap.data());
    if(JSON.stringify(n)!==JSON.stringify(S)){S=n;cache();render();renderTimer()}
    setSync(snap.metadata.fromCache?"Offline":"Synced");
  },()=>setSync("Offline"));
}
async function initCloud(){
  try{
    const[a,au,f]=await Promise.all([load("firebase-app.js"),load("firebase-auth.js"),load("firebase-firestore.js")]);
    const app=a.initializeApp(CFG);
    let fs;
    try{fs=f.initializeFirestore(app,{localCache:f.persistentLocalCache({tabManager:f.persistentMultipleTabManager()})})}
    catch(e){fs=f.getFirestore(app)}
    cloud={au,f,fs,auth:au.getAuth(app)};cloudState="ready";
    au.onAuthStateChanged(cloud.auth,onUser);
  }catch(e){
    cloudState="failed";
    if(user)setSync("Offline");else err("Can't reach the cloud. Check your internet and reopen the app.");
  }
}
function onUser(fu){
  if(!fu){if(user){detach();user=null;S=null;showAuth()}return}
  if(!user||user.uid!==fu.uid){
    const c=db.get("doal.cache");
    enterApp({uid:fu.uid,email:fu.email},c&&c.uid===fu.uid?c.data:null);
  }
  attach();
}

/* ---------- accounts ---------- */
function authMsg(e){
  const c=e&&e.code||"";
  if(c==="auth/email-already-in-use")return "That email already has an account. Tap Sign in.";
  if(["auth/invalid-credential","auth/wrong-password","auth/user-not-found","auth/invalid-login-credentials"].includes(c))return "Wrong email or password. New here? Tap Create account.";
  if(c==="auth/weak-password")return "Password needs at least 6 characters.";
  if(c==="auth/invalid-email")return "Enter a valid email address.";
  if(c==="auth/network-request-failed")return "No connection. Check your internet and try again.";
  if(c==="auth/too-many-requests")return "Too many attempts. Wait a few minutes and try again.";
  if(c==="auth/operation-not-supported-in-this-environment"||c==="auth/unauthorized-domain")return "Open DOAL from the installed app or a web link, not as a local file.";
  return "Couldn't sign in ("+(c||"unknown error")+").";
}
const emailOk=s=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s);
async function doAuth(create){
  const em=$("em").value.trim().toLowerCase(),pw=$("pw").value;
  if(!emailOk(em))return err("Enter a valid email address.");
  if(pw.length<6)return err("Password needs at least 6 characters.");
  if(!cloud)return err(cloudState==="loading"?"Still connecting. Try again in a moment.":"Can't reach the cloud. Check your internet and reopen the app.");
  const btns=[$("signin"),$("signup")];btns.forEach(b=>b.disabled=true);err("");
  try{
    await(create?cloud.au.createUserWithEmailAndPassword(cloud.auth,em,pw):cloud.au.signInWithEmailAndPassword(cloud.auth,em,pw));
  }catch(e){err(authMsg(e))}
  btns.forEach(b=>b.disabled=false);
}
function enterApp(u,d){
  user=u;S=clean(d);
  ui.open=null;T.task=null;stopTimer();sync();cache();
  $("auth").hidden=true;$("app").hidden=false;$("pw").value="";err("");
  render();renderTimer();
  setSync(cloud?"Syncing":cloudState==="failed"?"Offline":"Connecting\u2026");
}
function showAuth(){
  $("app").hidden=true;$("auth").hidden=false;$("who").textContent="";setSync("");$("pw").value="";
}
async function logout(){
  detach();stopTimer();
  if(saveT){clearTimeout(saveT);await Promise.race([push(),new Promise(r=>setTimeout(r,2500))])}
  db.del("doal.cache");user=null;S=null;showAuth();
  if(cloud)try{await cloud.au.signOut(cloud.auth)}catch(e){}
}

/* ---------- rendering ---------- */
const chip=(x,c="")=>el("span",{class:"chip "+c,text:x});

function panel(t){
  const tin=el("input",{type:"text",class:"field",value:t.text,maxLength:120,"aria-label":"Task name",onchange:()=>{const v=tin.value.trim();if(v){t.text=v;save();render()}else tin.value=t.text}});
  const seg=el("div",{class:"seg"},...["Low","Medium","High"].map((n,i)=>el("button",{type:"button",class:"p"+i+(t.pri===i?" on":""),text:n,onclick:()=>{t.pri=i;save();render()}})));
  const dt=el("input",{type:"date",class:"field",value:t.due,"aria-label":"Due date",onchange:()=>{t.due=dt.value;save();render()}});
  const dy=el("button",{type:"button",class:"ghost tog"+(t.daily?" on":""),text:"Daily",onclick:()=>{t.daily=!t.daily;sync();save();render()}});
  const subs=el("div",{class:"subs"});
  t.subs.forEach((s,i)=>{
    const c=el("input",{type:"checkbox",checked:s.d,"aria-label":s.t,onchange:()=>{s.d=c.checked;save();render()}});
    subs.append(el("div",{class:"sub"+(s.d?" done":"")},el("label",{},c,el("span",{text:s.t})),el("button",{type:"button",class:"del sm",text:"\u00d7","aria-label":"Remove step",onclick:()=>{t.subs.splice(i,1);save();render()}})));
  });
  const sin=el("input",{type:"text",class:"field","data-sub":"1",placeholder:"Add a step",maxLength:100,"aria-label":"New step"});
  const addSub=()=>{const v=sin.value.trim();if(!v)return;t.subs.push({t:v,d:false});save();ui.refocus=1;render()};
  sin.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addSub()}};
  const linked=T.task===t.id;
  const fb=el("button",{type:"button",class:"ghost",text:linked?"Clear focus":"Focus on this",onclick:()=>{
    T.task=linked?null:t.id;renderTimer();
    if(!linked){$("focus").scrollIntoView({behavior:"smooth",block:"center"});toast("Timer linked to this task")}
  }});
  return el("div",{class:"panel"},tin,seg,el("div",{class:"opts"},dt,dy),subs,el("div",{class:"addrow"},sin,el("button",{type:"button",class:"ghost",text:"Add",onclick:addSub})),fb);
}

function row(t){
  const d=isDone(t),di=dueInfo(t);
  const li=el("li",{class:"glass p"+t.pri+(d?" done":"")});
  const cb=el("input",{type:"checkbox",checked:d,"aria-label":"Done: "+t.text,onchange:()=>{t.doneOn=cb.checked?today():"";sync();save();render()}});
  const chips=el("div",{class:"chips"});
  if(di)chips.append(chip(di[0],di[1]));
  if(t.daily)chips.append(chip("Daily"));
  if(t.subs.length)chips.append(chip(t.subs.filter(s=>s.d).length+"/"+t.subs.length+" steps"));
  if(t.f)chips.append(chip(t.f+" min focus"));
  const main=el("div",{class:"main",role:"button",tabIndex:0,"aria-expanded":String(ui.open===t.id),
    onclick:()=>{ui.open=ui.open===t.id?null:t.id;render()},
    onkeydown:e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();main.click()}}},
    el("span",{class:"tx",text:t.text}),chips);
  const x=el("button",{type:"button",class:"del",text:"\u00d7","aria-label":"Delete "+t.text,onclick:()=>{
    S.tasks=S.tasks.filter(k=>k!==t);if(ui.open===t.id)ui.open=null;if(T.task===t.id)T.task=null;sync();save();render();renderTimer();
  }});
  li.append(el("div",{class:"top"},cb,main,x));
  if(ui.open===t.id)li.append(panel(t));
  return li;
}

function render(){
  if(!S)return;
  const td=today(),[cur,best]=streaks();
  $("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
  $("who").textContent=user.email||"";
  $("streak").textContent=cur;$("best").textContent=best;$("fmin").textContent=S.fmin||0;
  const pool=S.tasks.filter(t=>!isDone(t)||t.doneOn===td),done=pool.filter(isDone).length,p=pool.length?Math.round(done/pool.length*100):0;
  $("cnt").textContent=done+" / "+pool.length;
  $("fill").style.width=p+"%";
  $("msg").textContent=message(p,pool.length,cur);
  let L=S.tasks.filter(t=>({all:1,open:!isDone(t),today:!isDone(t)&&(t.daily||(t.due&&t.due<=td)),done:isDone(t)})[ui.f]);
  if(ui.q){const q=ui.q.toLowerCase();L=L.filter(t=>t.text.toLowerCase().includes(q)||t.subs.some(s=>s.t.toLowerCase().includes(q)))}
  L.sort(cmp);
  const ul=$("list");ul.textContent="";
  if(!L.length){
    const msg=ui.q?"Nothing matches your search.":!S.tasks.length?"No tasks yet. Type one above and tap Add.":ui.f==="done"?"Nothing finished yet.":"Nothing here. Nice.";
    ul.append(el("li",{class:"glass empty",text:msg}));
  }
  L.forEach(t=>ul.append(row(t)));
  document.querySelectorAll("#filt button").forEach(b=>b.classList.toggle("on",b.dataset.f===ui.f));
  if(ui.refocus){const i=document.querySelector(".panel [data-sub]");if(i)i.focus();ui.refocus=null}
}

function syncAdd(){
  document.querySelectorAll("#apri button").forEach(b=>b.classList.toggle("on",+b.dataset.p===ui.pri));
  $("dly").classList.toggle("on",ui.daily);
}
function addTask(){
  const v=$("in").value.trim();
  if(!v){$("in").focus();return}
  S.tasks.push(norm({text:v,pri:ui.pri,due:ui.due,daily:ui.daily}));
  $("in").value="";$("due").value="";ui.due="";ui.daily=false;ui.pri=1;
  syncAdd();save();render();$("in").focus();
}

/* ---------- focus timer ---------- */
const T={dur:25,left:1500,run:false,end:0,iv:null,task:null};
const fmt=s=>pad(Math.floor(s/60))+":"+pad(s%60);
function renderTimer(){
  $("tm").textContent=fmt(T.left);
  $("tfill").style.width=(100-T.left/(T.dur*60)*100)+"%";
  $("go").textContent=T.run?"Pause":T.left<T.dur*60?"Resume":"Start";
  document.querySelectorAll("#durs button").forEach(b=>{b.classList.toggle("on",+b.dataset.d===T.dur);b.disabled=T.run});
  const tk=S&&S.tasks.find(x=>x.id===T.task);
  $("ftask").textContent=tk?"Focusing on: "+tk.text:"No task selected. Open a task and tap Focus.";
}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.08;o.start();o.stop(a.currentTime+.4)}catch(e){}}
function finish(){
  clearInterval(T.iv);T.run=false;
  const m=T.dur,tk=S.tasks.find(x=>x.id===T.task);
  S.fmin=(S.fmin||0)+m;if(tk)tk.f=(tk.f||0)+m;save();
  T.left=T.dur*60;
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
  beep();toast("Focus session done. "+m+" min logged.");render();
}
function tick(){
  T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  if(T.left<=0)finish();
  renderTimer();
}
function stopTimer(){clearInterval(T.iv);T.run=false;T.left=T.dur*60}

/* ---------- wiring ---------- */
$("signin").onclick=()=>doAuth(false);
$("signup").onclick=()=>doAuth(true);
$("forgot").onclick=async()=>{
  const em=$("em").value.trim().toLowerCase();
  if(!emailOk(em))return err("Type your email above first.");
  if(!cloud)return err("Can't reach the cloud. Check your internet.");
  try{await cloud.au.sendPasswordResetEmail(cloud.auth,em);err("");toast("Reset link sent. Check your inbox.")}
  catch(e){err(authMsg(e))}
};
[$("em"),$("pw")].forEach(i=>i.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();doAuth(false)}});
$("addbtn").onclick=addTask;
$("in").onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addTask()}};
$("apri").onclick=e=>{const b=e.target.closest("button");if(b){ui.pri=+b.dataset.p;syncAdd()}};
$("due").onchange=e=>{ui.due=e.target.value};
$("dly").onclick=()=>{ui.daily=!ui.daily;syncAdd()};
$("filt").onclick=e=>{const b=e.target.closest("button");if(b){ui.f=b.dataset.f;render()}};
$("q").oninput=e=>{ui.q=e.target.value.trim();render()};
$("durs").onclick=e=>{const b=e.target.closest("button");if(b&&!T.run){T.dur=+b.dataset.d;T.left=T.dur*60;renderTimer()}};
$("go").onclick=()=>{
  if(T.run){clearInterval(T.iv);T.run=false}
  else{T.run=true;T.end=Date.now()+T.left*1000;T.iv=setInterval(tick,250)}
  renderTimer();
};
$("rst").onclick=()=>{stopTimer();renderTimer()};
$("clr").onclick=()=>{
  const n=S.tasks.length;S.tasks=S.tasks.filter(t=>!(isDone(t)&&!t.daily));
  sync();save();render();toast(n-S.tasks.length?"Finished tasks cleared":"No finished tasks to clear");
};
$("exp").onclick=()=>{
  const a=el("a",{href:URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"})),download:"doal-backup.json"});
  document.body.append(a);a.click();a.remove();toast("Backup saved");
};
$("imp").onclick=()=>$("file").click();
$("file").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);if(!Array.isArray(d.tasks))throw 0;
      S=clean(d);sync();save();render();toast("Backup restored");
    }catch(x){toast("That isn't a DOAL backup file")}
  };
  r.readAsText(f);e.target.value="";
};
$("out").onclick=logout;
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S){if(T.run)tick();render()}});
addEventListener("offline",()=>{if(user)setSync("Offline")});
addEventListener("online",()=>{if(user)setSync("Syncing")});

/* ---------- boot: open from cache instantly, then connect ---------- */
const c0=db.get("doal.cache");
if(c0&&c0.uid)enterApp({uid:c0.uid,email:c0.email},c0.data);
initCloud();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
